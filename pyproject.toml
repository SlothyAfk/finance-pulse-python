[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finance-pulse"
dynamic = ["version"]
description = "Python client and MCP server for the Finance Pulse API: financial news as structured, sourced statements with sentiment, clustered into developments."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "FinTopic" }]
keywords = ["finance", "news", "sentiment", "stocks", "mcp", "llm", "rag", "rapidapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Office/Business :: Financial",
]
dependencies = ["httpx>=0.27", "mcp>=2,<3", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
finance-pulse = "finance_pulse.mcp_server:main"          # so `uvx finance-pulse` starts the MCP server
finance-pulse-mcp = "finance_pulse.mcp_server:main"

[project.urls]
Homepage = "https://fintopic.news/docs"
Documentation = "https://fintopic.news/docs/reference"
"Get an API key" = "https://rapidapi.com/evankos/api/finance-pulse/pricing"
Repository = "https://github.com/SlothyAfk/finance-pulse-python"
Issues = "https://github.com/SlothyAfk/finance-pulse-python/issues"

[tool.hatch.version]
path = "src/finance_pulse/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
